<meta name="description" content="LearnSphere: structured, bite-sized lessons with progress saved on your device.">

<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A0C10;--panel:#12151B;--panel2:#181C24;--line:#232832;--tx:#E8ECF2;--mut:#8A93A3;--accent:#35E0C0;--pg:#7AA7FF;--rs:#FF7A59;--k8s:#A78BFA;--dk:#38BDF8;--tf:#E879F9;--az:#FBBF24;--aws:#4ADE80;--do:#FB7185;--ora:#F2543D;--mss:#E5484D;--r:18px;
--sans:'Space Grotesk',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;box-sizing:border-box}
:root[data-theme=tinted]{--bg:#17212B;--panel:#1E2A36;--panel2:#253342;--line:#314154;--tx:#E6EDF4;--mut:#8EA2B5}
:root[data-theme=light]{--bg:#F4F6FA;--panel:#fff;--panel2:#EEF1F6;--line:#DDE2EB;--tx:#10141C;--mut:#5E6878;--accent:#0FA68C}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 var(--sans);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
background-image:radial-gradient(600px 300px at 85% -50px,color-mix(in srgb,var(--accent) 14%,transparent),transparent),radial-gradient(500px 300px at 0 120px,color-mix(in srgb,var(--pg) 10%,transparent),transparent);background-repeat:no-repeat}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.wrap{max-width:980px;margin:0 auto;padding:0 18px 60px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;backdrop-filter:blur(14px);background:color-mix(in srgb,var(--bg) 78%,transparent);border-bottom:1px solid var(--line)}
.bar{max-width:980px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:-.3px;font-size:18px;cursor:pointer}
.logo i{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--pg));display:grid;place-items:center;color:#06100E;font-style:normal;font-size:15px}
.sp{flex:1}
#inst[hidden]{display:none}
.ib{width:36px;height:36px;border-radius:11px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center}
.crumbs{display:flex;gap:6px;align-items:center;flex-wrap:wrap;color:var(--mut);font:12px var(--mono);padding:18px 0 4px}
.crumbs a{color:var(--mut);cursor:pointer}.crumbs a:hover{color:var(--accent)}
h1{font-size:clamp(26px,5vw,38px);letter-spacing:-1px;line-height:1.1;margin:14px 0 6px}
.sub{color:var(--mut);margin:0 0 22px;max-width:60ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;position:relative;overflow:hidden;transition:transform .18s,border-color .18s;cursor:pointer;animation:up .4s both}
.card:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--c,var(--accent)) 60%,var(--line))}
.card:before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--c,var(--accent));opacity:.9}
.card.off{opacity:.65;cursor:default}.card.off:hover{transform:none;border-color:var(--line)}
@keyframes up{from{opacity:0;transform:translateY(8px)}}
.chip{display:inline-flex;gap:6px;align-items:center;font:600 11px var(--mono);padding:4px 9px;border-radius:99px;background:var(--panel2);color:var(--mut);border:1px solid var(--line)}
.chip.live{color:var(--accent)}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.card h3{margin:12px 0 4px;font-size:20px;letter-spacing:-.4px}
.card p{margin:0;color:var(--mut);font-size:13.5px}
.bt{height:6px;border-radius:9px;background:var(--panel2);overflow:hidden;margin-top:14px}
.bt b{display:block;height:100%;background:var(--c,var(--accent));border-radius:9px;transition:width .4s}
.pct{font:600 12px var(--mono);color:var(--mut);margin-top:6px;display:flex;justify-content:space-between}
.ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font:700 20px var(--mono);background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}
.hero{background:linear-gradient(135deg,color-mix(in srgb,var(--c) 18%,var(--panel)),var(--panel));border:1px solid var(--line);border-radius:24px;padding:22px;margin:14px 0 24px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.hero .tx{flex:1;min-width:230px}
.ring{--p:0;width:96px;height:96px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--panel2) 0);display:grid;place-items:center}
.ring span{width:78px;height:78px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font:700 18px var(--mono)}
.btn{background:var(--accent);color:#06100E;font-weight:700;padding:11px 18px;border-radius:12px;display:inline-flex;gap:8px;align-items:center}
.btn.ghost{background:var(--panel2);color:var(--tx);border:1px solid var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.stats{display:flex;gap:22px;flex-wrap:wrap;margin-top:6px}.stats div{font:12px var(--mono);color:var(--mut)}.stats b{display:block;font:700 20px var(--sans);color:var(--tx)}
.sec{display:flex;gap:14px;align-items:flex-start}
.num{font:700 13px var(--mono);color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border-radius:10px;padding:6px 9px}
.sec h3{margin:0 0 3px;font-size:17px}
.lec{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:9px;overflow:hidden}
.lh{display:flex;gap:12px;align-items:center;padding:13px 14px;cursor:pointer}
.chk{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:transparent;font-size:14px;transition:.15s}
.done .chk{background:var(--accent);border-color:var(--accent);color:#06100E}
.lh .t{flex:1;font-weight:500}.done .t{color:var(--mut)}
.lh small{font:12px var(--mono);color:var(--mut)}
.ld{display:none;padding:0 14px 14px 50px;color:var(--mut);font-size:14px}
.open .ld{display:block}.open .lh{background:var(--panel2)}
.ld .mk{margin-top:10px;display:inline-flex}
.quiz .chk{border-radius:50%}.quiz .t{color:var(--mut)}
.pn{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}
h2{font-size:14px;font:600 12px var(--mono);letter-spacing:.8px;text-transform:uppercase;color:var(--mut);margin:26px 0 12px}
.h2row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:26px 0 12px}.h2row h2{margin:0}
.dens{width:32px;height:32px;border-radius:10px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;color:var(--mut)}
.dens svg{width:14px;height:14px}.dens:hover,.dens.on{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.dens.on{background:color-mix(in srgb,var(--accent) 10%,var(--panel))}
body.compact .grid.courses{gap:8px}
.ib{position:relative}
/* Tappable UI is not selectable text: stops mobile Chrome's "Tap to search" panel / word highlight when navigating */
[onclick],button,.card,.crumbs,.hero,.lec .lh,.pn,.chip,.hc,.hf,header,.h2row,.addl-h,.tcard,.ac,.seg{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
input,textarea,.ls,.ld{-webkit-user-select:text;user-select:text}
.sq{width:100%;margin:14px 0 6px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--tx);font:15px var(--sans);outline:none}
.sq:focus{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.sq-seg{display:flex;flex-direction:column;gap:8px;margin:6px 0 4px}
.seg{display:grid;grid-template-columns:1fr 1fr;width:100%;padding:3px;gap:3px;background:var(--panel2);border:1px solid var(--line);border-radius:12px}
.seg button{min-width:0;padding:9px 8px;border-radius:9px;font:600 12px var(--mono);color:var(--mut);text-align:center;line-height:1.25;display:flex;align-items:center;justify-content:center;transition:background .15s,color .15s}
.seg button:hover{color:var(--tx)}
.seg button.on{background:color-mix(in srgb,var(--accent) 16%,var(--panel));color:var(--accent);box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 40%,var(--line))}
@media(max-width:380px){.seg button{font-size:11px;padding:9px 4px}}

/* ---- reader controls, bookmarks, progress bar, flashcards ---- */
.bar{gap:10px}
.ib.txt{font:700 13px var(--sans);letter-spacing:-.5px}
.ib.on{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
@media(max-width:520px){.bar{gap:6px;padding:10px 12px}.ib{width:34px;height:34px}.logo{font-size:0}.logo i{font-size:15px}}
#rbar{position:fixed;left:0;top:0;height:3px;width:0;z-index:40;background:linear-gradient(90deg,var(--accent),var(--pg));pointer-events:none;display:none;transition:width .08s linear}
.rp{position:fixed;z-index:25;top:58px;right:14px;width:min(340px,calc(100vw - 28px));max-height:calc(100vh - 76px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 18px 40px -16px rgba(0,0,0,.6);display:none}
.rp.open{display:block}
.rp h5{margin:0 0 8px;font:600 11px var(--mono);letter-spacing:.6px;text-transform:uppercase;color:var(--mut)}
.rp .sec2{margin-bottom:14px}.rp .sec2:last-child{margin-bottom:0}

.tcards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tc{display:flex;flex-direction:column;align-items:center;gap:6px;font:600 12px var(--sans);color:var(--mut)}
.tc.on{color:var(--accent)}
.tcard{position:relative;width:100%;height:74px;border-radius:12px;border:2px solid transparent;padding:8px;display:flex;flex-direction:column;gap:5px;align-items:flex-start}
.tcard i{position:absolute;left:50%;bottom:7px;width:14px;height:14px;margin-left:-7px;border-radius:50%;border:2px solid rgba(255,255,255,.55)}
.tc.on .tcard{border-color:var(--accent)}
.tc.on .tcard i{border-color:#fff;background:radial-gradient(circle,#fff 0 3px,transparent 4px)}
.tcard b{display:block;height:9px;border-radius:4px;width:52%}
.tcard b+b{align-self:flex-end;width:62%}
.t-light{background:#d9e6f4}.t-light b{background:#fff}.t-light b+b{background:#b5d1ee}
.t-tinted{background:#3b4752}.t-tinted b{background:#6c7e8d}.t-tinted b+b{background:#4a8fc7}
.t-dark{background:#1a1f27}.t-dark b{background:#394150}.t-dark b+b{background:#1d7f6e}
.acs{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
#rpW{grid-template-columns:repeat(3,1fr)}
.ac{width:24px;height:24px;border-radius:50%;border:2px solid transparent;background:var(--c);box-shadow:inset 0 0 0 2px var(--panel);position:relative;flex:none}
.ac.on{border-color:var(--c)}
.ac.cust{background:conic-gradient(#f87171,#fbbf24,#4ade80,#38bdf8,#a78bfa,#f87171);display:grid;place-items:center}
.ac.cust input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:0;padding:0}
.chkr{display:flex;align-items:center;gap:10px;margin-top:12px;font:14px var(--sans);cursor:pointer}
.chkr input{width:18px;height:18px;accent-color:var(--accent);flex:none;margin:0}
.chkr small{margin-left:auto;font:600 11px var(--mono);color:var(--mut)}
.stp{display:grid;grid-template-columns:44px 1fr 44px;gap:6px;align-items:center}
.stp button,.rp-reset{height:38px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font:700 15px var(--sans)}
.stp button:hover,.rp-reset:hover{border-color:var(--accent);color:var(--accent)}
.stp span{text-align:center;font:600 13px var(--mono);color:var(--mut)}
.rp-reset{width:100%;font:600 12px var(--mono);color:var(--mut)}
.bmk{display:inline-grid;place-items:center;width:34px;height:34px;margin-left:10px;vertical-align:middle;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--mut);font-size:17px;line-height:1}
.bmk:hover,.bmk.on{color:#f5b942;border-color:#f5b942}
.bmg{display:flex;align-items:center;gap:8px;margin:14px 0 8px;font-weight:700}
.bmg:first-child{margin-top:2px}
.bmg-top{font-size:15px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.bmg-dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.bmg-sub{font:600 12px var(--mono);color:var(--mut);margin:10px 0 8px 18px}
.bmg-sub:before{content:'';width:8px;height:8px;border-radius:2px;background:var(--c);flex:none}
.bmg small{margin-left:auto;font:600 11px var(--mono);color:var(--mut)}
.bmi-sub{margin-left:18px}
.bmrm{flex:none;width:28px;height:28px;border-radius:8px;border:1px solid var(--line);color:var(--mut)}
.bmrm:hover{color:#ff4d6d;border-color:#ff4d6d}
.sq-snip{font-size:12.5px;color:var(--mut);margin-top:6px;line-height:1.45;word-break:break-word}
.sq-scope{font:600 11px var(--mono);color:var(--mut);margin:0 0 10px}
.sq-scope b{color:var(--accent)}
.hc mark{background:color-mix(in srgb,var(--accent) 30%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.hm{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);display:none;align-items:flex-start;justify-content:center;padding:max(18px,env(safe-area-inset-top,0px)) 14px 14px}
.hm.open{display:flex}
.hd{width:min(640px,100%);max-height:calc(100vh - 36px);display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 24px 60px -20px rgba(0,0,0,.6)}
.hd-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.hd-top h2{margin:0;font:700 18px var(--sans);letter-spacing:-.3px;text-transform:none;color:var(--tx)}
.hd-top p{margin:2px 0 0;font:12px var(--mono);color:var(--mut)}
.hd-tb{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:14px 0 12px}
.hd-f{display:flex;gap:6px;flex-wrap:wrap}
.hf{font:600 11px var(--mono);color:var(--mut);background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:6px 12px}
.hf:hover{color:var(--tx)}.hf.on{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,var(--line));background:color-mix(in srgb,var(--accent) 9%,var(--panel2))}
.hclr{font:600 11px var(--mono);color:var(--mut);border:1px solid var(--line);border-radius:20px;padding:6px 12px}
.hclr:hover{color:#ff4d6d;border-color:#ff4d6d}
.hl{overflow:auto;flex:1;min-height:0}
.hi{display:flex;gap:12px}
.hr{position:relative;width:16px;flex:none;display:flex;justify-content:center}
.hr:before{content:'';position:absolute;top:18px;bottom:0;left:7px;width:1px;background:var(--line)}
.hi:last-child .hr:before{display:none}
.hdot{width:15px;height:15px;border-radius:50%;margin-top:3px;box-shadow:0 0 0 3px var(--panel);background:var(--c)}
.hc{flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:11px;cursor:pointer}
.hc:hover{border-color:color-mix(in srgb,var(--c) 55%,var(--line))}
.hc-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.hc-t{font-weight:600;font-size:14px;line-height:1.3}
.hc-s{font:11.5px var(--mono);color:var(--mut);margin-top:3px}
.hc-time{font:600 10.5px var(--mono);color:var(--mut);white-space:nowrap}
.hc-tags{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.hempty{text-align:center;padding:38px 16px;color:var(--mut)}
.hempty b{display:block;color:var(--tx);font-size:14px;margin:8px 0 5px}
.hundo{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:30;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;gap:14px;align-items:center;font-size:13px;box-shadow:0 12px 30px -10px rgba(0,0,0,.6)}
.hundo button{color:var(--accent);font-weight:700}
body.compact .grid.courses .card{display:flex;align-items:center;gap:12px;padding:10px 12px;animation:none}
body.compact .grid.courses .card:hover{transform:none}
body.compact .grid.courses .card:before{width:3px;height:100%;inset:0 auto 0 0}
body.compact .grid.courses .ico{width:34px;height:34px;border-radius:10px;font-size:15px;flex:none}
body.compact .grid.courses .card h3{margin:0;font-size:15px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.compact .grid.courses .card p,body.compact .grid.courses .meta,body.compact .grid.courses .pct{display:none}
body.compact .grid.courses .bt{position:absolute;left:0;right:0;bottom:0;margin:0;height:3px;border-radius:0}
@media(max-width:520px){.ld{padding-left:14px}.hero{padding:18px}}
@media(max-width:480px){
.hero.course{display:grid;grid-template-columns:1fr auto;column-gap:14px;align-items:center}
.hero.course .tx{display:contents}
.hero.course .chip{grid-column:1/-1;grid-row:1;justify-self:start}
.hero.course h1{grid-column:1/-1;grid-row:2}
.hero.course .stats{grid-column:1;grid-row:3}
.hero.course .row{grid-column:1;grid-row:4}
.hero.course .ring{grid-column:2;grid-row:3/5;width:84px;height:84px}
.hero.course .ring span{width:68px;height:68px;font-size:16px}
.hero.course .auto{grid-column:1/-1;grid-row:5}
}

.ls{max-width:var(--rw,760px);font-size:calc(15px*var(--rs,1))}
.ls p{color:var(--tx);margin:0 0 14px;line-height:1.65}
.ls h4{font:700 calc(19px*var(--rs,1)) var(--sans);letter-spacing:-.3px;margin:30px 0 10px;padding-left:12px;border-left:3px solid var(--c,var(--accent))}
.ls ul{margin:0 0 16px;padding:0;list-style:none}.ls li{position:relative;padding:5px 0 5px 22px}
.ls li:before{content:"";position:absolute;left:4px;top:14px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.ls code{font:calc(13px*var(--rs,1)) var(--mono);background:var(--panel2);border:1px solid var(--line);padding:1px 6px;border-radius:6px;color:var(--accent)}
.tw{overflow-x:auto;margin:0 0 18px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.tw table{border-collapse:collapse;width:100%;font-size:calc(14px*var(--rs,1))}
.tw th{text-align:left;font:600 12px var(--mono);text-transform:uppercase;letter-spacing:.5px;color:var(--mut);background:var(--panel2)}
.tw th,.tw td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
.tw tr:last-child td{border-bottom:0}.tw td:first-child{font-weight:600;white-space:nowrap}
.fl{display:flex;flex-wrap:wrap;align-items:center;gap:8px 6px;margin:0 0 20px;padding:16px;background:var(--panel);border:1px solid var(--line);border-radius:14px}
.fl .sw{display:inline-flex;align-items:center;gap:6px;max-width:100%;min-width:0}
.fl .tx{min-width:0;overflow-wrap:anywhere}

const COURSES=[
{id:'pg',name:'PostgreSQL DBA',tag:'PG',color:'var(--pg)',level:'Beginner → Production',blurb:'Install, secure, back up, tune and replicate PostgreSQL like a production DBA.',
outcomes:['Installation & configuration','Architecture & WAL','Backup & recovery','Replication & HA','Performance tuning','Security & roles'],
sections:[
{t:'Introduction',q:'Introduction Quiz',l:[
['Introduction to PostgreSQL DBA','3:01','Course overview: who it is for, what you will be able to do, the eleven sections at a glance and a prerequisites self-check. The study plan and capstone project are in Additional content.'],
['What is PostgreSQL','7:46','What PostgreSQL is and why it stays a reliable open-source relational database: ACID, MVCC, security, scalability and extensibility.'],
['DBA Role and Responsibilities','4:01','The DBA role and real-world tasks. Compares PostgreSQL with Oracle and SQL Server: open-source features, ACID, indexing and high availability.']]},
{t:'Installation Methods',q:'Installation Methods Quiz',l:[
['Postgres Installation','9:28','Installation methods on Windows and Linux: Windows GUI installer, Linux in VirtualBox, connecting with PuTTY and WinSCP.'],
['Source Method Installation','28:23',''],
['Yum Method Installation','11:40','Install PostgreSQL 18 on a Linux server via yum and the enterprise repository. Initialize the database, enable the service with systemctl, verify version and data directory.'],
['RPM Method Installation','9:32','RPM installation for enterprise stability, upgrades and package management: library, client and server installs, cluster initialization and verification.'],
['GUI Installation','15:01','Production-ready Windows install: verify environment, set install and data directories, default port 5432, validate with pgAdmin and psql.'],
['Postgres Uninstallations','13:50','Controlled uninstall as part of the lifecycle: pre-checks, backups with pg_dumpall, and clean removal for yum, rpm, source or Windows.']]},
{t:'Basic Configuration and Connectivity',q:'Shutdown, Multicluster & Tools Quiz',l:[
['Remote connection from Linux to pgAdmin','13:49','Connect a remote Linux server to pgAdmin on Windows: validate network, configure pg_hba.conf and listen_addresses, adjust firewall, register the server.'],
['Multicluster Configuration','27:25',''],
['Shutdown Modes','11:17','Shutdown modes with pg_ctl: smart (default), fast and immediate. Production use, safety and recovery implications, restart vs reload.']]},
{t:'PostgreSQL Architecture',q:'Architecture, WAL & Checkpoint Quiz',l:[
['Architecture – PostMaster Process','15:29','How the postmaster starts PostgreSQL, validates config, spawns a backend per client and coordinates background processes for crash recovery.'],
['Architecture – Backend Process','13:44','A dedicated backend per client connection forks from the postmaster, attaches to shared memory and handles parsing, planning and execution.'],
['Architecture – Background Process','12:30','Checkpointer, background writer, WAL writer, archiver, stats collector and more, working under the postmaster for durability and availability.'],
['Architecture – Memory','12:59','Shared memory vs local memory per backend, and how the buffer manager uses shared buffers to cache 8 KB data pages.'],
['Architecture – WAL','13:46','Write-ahead logging: LSN, WAL buffers and WAL segment files supporting crash recovery through redo and checkpoints with fsync.']]},
{t:'Database and Storage Management',q:'Templates, Schema & Session Management Quiz',l:[
['Catalog Views','23:45','The data dictionary and metadata about databases, objects and privileges. Practical pg_catalog and information_schema queries for monitoring and auditing.'],
['DB Creation and Template Databases','16:35','Create and manage databases from a production view: default and template databases, creation syntax, safe dropping, template hygiene.'],
['Environment Variables','6:55','Environment variables to simplify connections, multi-cluster setups with pg_env.sh and batch profiles, standardized data paths.'],
['Cluster Hierarchy','9:42','Cluster → databases → schemas → tables → columns; logical vs physical architecture, tablespaces and OIDs.'],
['Kill Sessions','14:08','Cancel or terminate long-running or blocked queries with pg_cancel_backend and pg_terminate_backend; find blockers with pg_stat_activity.'],
['Schema Management','15:25','Schemas to organize databases, isolate security and support multi-tenant designs: system catalogs, search_path, governance best practices.'],
['How to Find DB, Schema, Table Sizes','4:51','Database, schema and table sizes using \\l, \\dn+ meta-commands and pg_size_pretty.'],
['Contrib Module','9:40','Add extensions such as pg_stat_statements via contrib: shared_preload_libraries and restarting the cluster.']]},
{t:'Logging and Parameters',q:'Configuration, Autovacuum & Memory Quiz',l:[
['Enable Logging Mechanism','8:47','Enable and verify logging, configure destinations, rotation and statements to troubleshoot performance, errors and audit activity.'],
['Parameters Basic','7:03',''],
['Parameter Types','3:53','GUC parameters: how name, setting, unit and context reveal defaults or changes; pg_settings queries for debugging and tuning.'],
['Parameter Reload or Restart','3:57','Parameter context decides reload vs restart (e.g. log_min_duration_statement vs shared_buffers) and maintenance windows.'],
['Parameter Changes by ALTER Command','2:17','ALTER SYSTEM writes to postgresql.auto.conf, which overrides postgresql.conf on reload.'],
['Memory Tuning Parameters','2:43','Tune shared_buffers, work_mem and effective_cache_size; e.g. 8 GB shared buffers on a 32 GB server.'],
['WAL and Checkpoint Parameters','1:53','wal_level replica, 30-minute checkpoint timeout and 1 GB max_wal_size; automatic checkpoints and growing WAL files.'],
['Logging Parameters','2:48','Enable log collector, destination and directory, restart, then query execution time, errors and disconnections.'],
['Autovacuum Parameter','3:09','Autovacuum prevents table bloat and transaction wraparound by cleaning dead tuples and reclaiming space, shown on a test table.']]},
{t:'User Management & Security',q:'Roles, Privileges & Security Quiz',l:[
['User Management Introduction','3:35','Role-level architecture to least-privilege design: users vs roles, the public role, grant/revoke strategies, role inheritance.'],
['Authentication and Authorization','11:41','Authentication vs authorization and how pg_hba.conf controls connections: trust, md5, scram, peer. Layered, role-based permissions. User name maps (pg_ident.conf) are in Additional content.'],
['Public Role','6:38','The public role, privilege escalation via search_path hijacking, and protection: revoke CREATE on public, schema-qualified calls.'],
['User Creation','7:38','Secure user creation: the CREATE ROLE command, attributes and their risks, avoiding superusers, passwords and expiry, changing and removing roles. Connection limits at four levels, per-role defaults and the CREATEROLE changes are in Additional content.'],
['Grant and Revoke','8:22','Role-based access control with GRANT/REVOKE: read-only and write roles, assigning permissions to roles, managing memberships.'],
['INHERIT vs NOINHERIT','10:04','Enterprise privilege model separating duties into a developer role and a NOINHERIT migration role with explicit activation.'],
['Row Level Security','10:01','Per-row access via policies (USING and WITH CHECK, permissive and restrictive, who bypasses RLS) for multi-tenant isolation in one table using session variables like app.current_company. Policies on the database role, connection pooling, what RLS does not cover and performance are in Additional content.']]},
{t:'Tablespaces & Storage',q:'Tablespace & WAL Concepts Quiz',l:[
['WAL Format','10:20','WAL files ensure durability, crash recovery and replication in pg_wal with 16 MB segments and LSN-based naming. Page and record internals, resource managers, full-page images and timelines are in Additional content.'],
['Tablespace Creation and Drop','9:30','Tablespaces map logical names to physical paths: create, assign and drop across databases; pg_default and pg_global.'],
['Tablespace Online Moving','10:12','Move tables and indexes to a new tablespace online to limit downtime.'],
['Tablespace Offline Moving','8:44','Move a tablespace offline to reclaim disk safely: stop the database, move files, back up, update the symbolic link. The copy-tool comparison and the Windows variant are in Additional content.']]},
{t:'Backup & Recovery',q:'Backup Tools & Strategies Quiz',l:[
['Backup and Restore','6:11','Logical and physical backups with pg_dump and pg_dumpall for migration, refresh and recovery. The seven-step backup programme is in Additional content.'],
['Backup Formats: Advantages and Disadvantages','6:32','Plain, custom, tar and directory formats; pg_dump vs pg_dumpall; restore speed, parallelism and production considerations.'],
['Connection Options','7:29','pg_dump connection options -d, -h, -p, -U, password handling with -w, plus -f, -F, -j, -a/-s, -c, -Z and -v.'],
['Restore','4:42','Pick the right restore method per format: psql for plain, pg_restore for custom. Fast bulk restores and the table of common errors are in Additional content.'],
['Backup Practicals','15:28','pg_dump in plain, tar, custom and directory formats for single or multiple tables, schemas and full databases, with real-world naming.'],
['Restore Practicals','7:25','Practical restores using psql for plain backups and pg_restore for custom and directory formats. Section-by-section restores, list files, script-only and owner-change scenarios are in Additional content.'],
['pg_dumpall','7:52','Cluster-level backup capturing all databases, schemas, data and global objects such as users and tablespaces.'],
['Physical Backup','5:50','pg_basebackup for data files, WAL and configs; online/offline backups and point-in-time recovery; combine logical and physical strategy. The pg_basebackup option reference is in Additional content.']]},
{t:'Upgrade & Replication',q:'Replication & Upgrade Tools Quiz',l:[
['Upgrade from 17 to 18','15:21','Major upgrade with pg_upgrade: dual binaries, port change 5432 → 5433, pre-upgrade validation, migration and post-upgrade object-count checks.'],
['Replication Theory','6:30','WAL-based streaming replication between primary and standby; hot standby and failover for high availability and recovery.'],
['Streaming Replication Setup','12:16','Configure streaming replication on PostgreSQL 18 from a base backup, with a replication user, archiving and wal_level replica.']]},
{t:'Performance, Maintenance & Scaling',q:'Performance & Maintenance Quiz',l:[
['Indexing: Types, Creation and Maintenance','0:00','Index types (btree, hash, GIN, GiST, BRIN), composite, partial, expression and covering indexes, CREATE INDEX CONCURRENTLY, REINDEX, and finding invalid, duplicate, unused and bloated indexes.'],
['Autovacuum and VACUUM in Depth','0:00','How autovacuum decides when to run, per-table tuning, monitoring, what blocks dead-row cleanup, VACUUM FULL vs pg_repack, and transaction id wraparound with freeze settings and alerts.'],
['Performance Tuning Workflow','0:00','Measure, find, fix, re-measure: pg_stat_statements, EXPLAIN and auto_explain, configuration starting points, operating system settings and pgbench benchmarking.'],
['Connection Pooling with PgBouncer','0:00','Why connections are expensive, session vs transaction pooling, pgbouncer.ini, auth_query, the admin console, pool sizing, alternatives and troubleshooting.'],
['Table Partitioning','0:00','Range, list and hash partitions, partition pruning, attaching and detaching partitions for retention, pg_partman, migrating an existing table and common pitfalls.']]}
]},
{id:'rs',name:'Amazon Redshift',tag:'RS',color:'var(--rs)',level:'Beginner → Production',blurb:'Provision, design, load, secure, tune and protect Amazon Redshift like a production DBA.',
outcomes:['Cluster & Serverless setup','Table design & loading','Workload management','Security & access control','Monitoring & tuning','Backup, DR & data sharing'],
sections:[
{t:'Introduction & Data Warehouse Foundations',q:'Data Warehousing & Redshift Basics Quiz',l:[
['Introduction to Redshift DBA','8:00','Course overview: who it is for, what you will be able to do, the fourteen sections at a glance and a prerequisites self-check. The study plan and capstone project are in Additional content.'],
['OLTP vs OLAP and Data Warehouse Concepts','8:00','Why analytics databases differ from transactional ones: row-by-row vs column-wise access, facts and dimensions, star schemas, ETL vs ELT and batch vs near-real-time loading.'],
['What is Amazon Redshift','8:00','A fully managed, petabyte-scale cloud data warehouse built on massively parallel processing and columnar storage, offered as provisioned clusters or Serverless, and where it fits among AWS analytics services.'],
['DBA Role and Shared Responsibility','8:00','What AWS manages (hardware, patching, storage durability, replacement of failed nodes) and what the DBA still owns: table design, loading, workload control, access, cost and monitoring.'],
['Redshift vs PostgreSQL, RDS, Aurora and Athena','8:00','Redshift derives from an early PostgreSQL release and speaks the PostgreSQL protocol, but is built for analytics: sort keys instead of indexes, informational constraints, distribution keys and different maintenance. Compared with RDS, Aurora and Athena.'],
['Study Plan, Capstone Project and Lab Cost Safety','0:00','A week-by-week study plan, the capstone warehouse you will build, and habits that prevent surprise bills: budgets, pausing, deleting and tagging lab resources.',1],
['The AWS Analytics Landscape','0:00','How Redshift fits with S3, Glue, Athena, EMR, Lake Formation, QuickSight and SageMaker in a modern data architecture.',2]]},
{t:'Architecture & Deployment Options',q:'Architecture & Storage Quiz',l:[
['Cluster Architecture: Leader Node, Compute Nodes and Slices','8:00','The leader node parses, plans and coordinates; compute nodes store data and run query steps; each node is divided into slices that process their share of the data in parallel. (Provisioned and Serverless)'],
['Columnar Storage, Blocks and Zone Maps','8:00','Columns are stored separately in 1 MB blocks and compressed; per-block minimum and maximum values (zone maps) let queries skip blocks, which is why sort keys replace indexes. (Provisioned and Serverless)'],
['Redshift Managed Storage','8:00','RA3, RG and Serverless use managed storage: fast local SSD for hot data and Amazon S3 for durable storage, so compute and storage scale and are billed independently. (Provisioned and Serverless)'],
['Provisioned vs Serverless','8:00','Cluster of nodes vs namespace and workgroup measured in RPUs: how each is sized and billed, which administration tasks disappear in Serverless, and how to choose. (Provisioned and Serverless)'],
['Node Types: RA3, RG and Retired DC2','8:00','The RA3 and Graviton-based RG families and their sizes, how RG relates to RA3, and why existing DC2 clusters must move to RA3, RG or Serverless. (Provisioned only)'],
['Query Lifecycle End to End','8:00','Parse, optimize, compile, run on the slices, aggregate on the leader node and return results, with the result cache short-circuiting repeat queries. (Provisioned and Serverless)'],
['Compilation, Segments, Steps and Streams','0:00','How the optimizer output becomes compiled code: steps, segments and streams, the compile cache and why a first run can be slower. (Provisioned and Serverless)',1],
['Release Tracks and Patch Versions','0:00','Current vs trailing maintenance tracks, patch numbering and how new instance types and features reach each track.',2],
['Multi-Warehouse Architecture Patterns','0:00','Separate warehouses for ETL, BI and ad hoc work sharing live data between them. Builds on data sharing in Section 14. (Provisioned and Serverless)',3]]},
{t:'Setup, Networking & Connectivity',q:'Setup & Connectivity Quiz',l:[
['AWS Prerequisites: Account, IAM and Regions','8:00','What you need before creating anything: an AWS account, IAM users and roles, choosing a Region and the permissions Redshift needs to reach S3.'],
['Create a Provisioned Cluster','8:00','Create a cluster from the console and the AWS CLI: node type and count, database name, admin user, subnet group, security group and IAM role, then verify status and endpoint. (Provisioned only)'],
['Create a Serverless Namespace and Workgroup','8:00','Create a namespace (databases, users, encryption) and a workgroup (compute, networking), set base capacity and connect. (Serverless only)'],
['VPC Networking for Redshift','8:00','VPC, subnet groups, security groups and the default port 5439, public vs private access and how traffic reaches the endpoint. (Provisioned and Serverless)'],
['Connecting with Query Editor v2 and psql','8:00','Run your first queries from the browser-based query editor and from psql using the endpoint, port and database name. (Provisioned and Serverless)'],
